[package]
name = "viper-v4-utility"
version = "0.1.0"
edition = "2024"
# 2026-09-29: Set the tested minimum to the current stable Rust for egui evaluation.
rust-version = "1.98.1"
license = "GPL-2.0-only"
description = "Machine-specific native utility for the Razer Viper V4 Pro"
publish = false

[lib]
name = "viper_v4_utility"
path = "src/lib.rs"

[[bin]]
name = "viperctl"
path = "src/bin/viperctl.rs"

[[bin]]
name = "viper-v4-utility"
path = "src/bin/viper-v4-utility.rs"

[features]
ui-preview = []
egui-preview = ["dep:eframe"]

[[bin]]
name = "viperpilot-ui-preview"
path = "src/bin/viperpilot-ui-preview.rs"
required-features = ["ui-preview"]

[[bin]]
name = "viperpilot-egui-preview"
path = "src/bin/viperpilot-egui-preview.rs"
required-features = ["egui-preview"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "accesskit", "default_fonts"], optional = true }

[dev-dependencies]
egui_kittest = { version = "=0.36.2", default-features = false }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.6", default-features = false, features = [
  "windows-native",
] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  # 2026-09-30: system annotations name numeric mouse-map controls; no custom provider.
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

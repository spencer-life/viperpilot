name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.16'
          install: false
          cache: false
      - name: Install pinned security scanners only
        run: >-
          mise install --locked
          aqua:rhysd/actionlint@1.7.12
          aqua:gitleaks/gitleaks@8.30.1
          aqua:zizmorcore/zizmor@1.30.1
      - name: Lint GitHub Actions workflows
        run: mise run --skip-tools actionlint
      - name: Scan all reachable history for secrets
        run: mise run --skip-tools gitleaks
      - name: Audit GitHub Actions workflow security
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run --skip-tools zizmor

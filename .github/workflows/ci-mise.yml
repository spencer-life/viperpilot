name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.*'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/ci-mise.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Hosted runners already provide Rust. Cross-build tools are WSL-only;
      # native Windows CI must not install the conda/cargo-xwin toolchain.
      MISE_ENABLE_TOOLS: ''
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: '2026.9.16'
          install: false
          cache: false
      # 2026-10-02: Reuse native dependency builds across PR updates;
      # exclude installed Cargo binaries from the shared cache.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
      - name: Check, test, build, and smoke-test without hardware on Linux
        if: runner.os == 'Linux'
        run: mise run ci
      - name: Check, test, build, and smoke-test without hardware on Windows
        if: runner.os == 'Windows'
        run: mise run ci-windows
